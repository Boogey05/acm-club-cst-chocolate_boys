<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACM Club - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ACM Student Chapter</h1>
        <p>Innovate • Code • Collaborate</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Events</a>
        <a href="#">Projects</a>
        <a href="contact.html">Contact</a>
        <a href="#">Link</a>

    <!-- Contact Section styled consistently with the hero/about sections -->
    <section class="about contact-section">
        <h2>Get in Touch</h2>
        <p>
            Have questions about our events, workshops, or membership? 
            Reach out to us using the form below or drop us an email!
        </p>
        
        <form class="contact-form">
            <div class="form-group">
                <input type="text" placeholder="Your Name" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Your Email" required>
            </div>
            <div class="form-group">
                <textarea rows="5" placeholder="Your Message" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 ACM Student Chapter. All Rights Reserved.</p>
    </footer>

</body>
